<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Axol Work: shift marketplace ranked by accommodation fit for Prospects and Recruiters. Inclusive hiring, Scout, and verified work history." />
    <title>Axol Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      // Apply theme + accessibility prefs before paint to avoid flash.
      (function () {
        try {
          var stored = localStorage.getItem('axol-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
        try {
          var raw = localStorage.getItem('axol-a11y');
          if (!raw) return;
          var p = JSON.parse(raw);
          var root = document.documentElement;
          if (p.textScale) root.style.fontSize = p.textScale + '%';
          if (p.highContrast) root.dataset.a11yContrast = 'high';
          if (p.reduceMotion) root.dataset.a11yMotion = 'reduce';
          if (p.underlineLinks) root.dataset.a11yLinks = 'underline';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
